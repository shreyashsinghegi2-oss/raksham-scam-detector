[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raksham-scam-detector"
version = "0.1.0"
description = "Scam-message classifier for Indian SMS, WhatsApp, email and call transcripts, trained on the Raksham scam dataset."
requires-python = ">=3.10"
dependencies = ["pandas", "scikit-learn", "joblib"]

[project.optional-dependencies]
serve = ["fastapi", "uvicorn[standard]"]
dev = ["pytest", "httpx", "fastapi", "uvicorn[standard]", "ruff"]

[project.scripts]
raksham-train = "raksham.train:main"
raksham-predict = "raksham.predict:main"
raksham-eval = "raksham.evaluate:main"
raksham-export = "raksham.export:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["web", "data", "models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "PLE"]
# Long lines are left alone: the code keeps explanatory comments and test strings on one line.
# B905 (zip strict=) is skipped so no behaviour changes.
ignore = ["E501", "B905"]

[tool.ruff.lint.per-file-ignores]
# These files adjust sys.path before importing, so their import order is deliberate.
"deploy/api/index.py" = ["E402", "I001"]
"scripts/*.py" = ["E402", "I001"]
"tests/test_deploy_app.py" = ["E402", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["raksham"]
