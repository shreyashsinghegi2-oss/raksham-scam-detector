name: Bug report
description: The detector, API or web page does something wrong or crashes
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste real personal messages, phone numbers, OTPs or account details. Replace them with placeholders such as `XXXX`.
        For security problems, do not open an issue. See SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you run, what did you expect, and what did you get instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A command, a request body or an example message (with personal details removed).
      render: shell
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Where did it happen
      options:
        - CLI (raksham-predict / raksham-train / raksham-eval)
        - API (FastAPI service)
        - Web page
        - Docs
        - Other
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: Python version and OS, or browser for the web page.
      placeholder: "Python 3.12, Ubuntu 24.04"
